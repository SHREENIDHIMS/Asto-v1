name: Evaluation on PR

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/search/**"
      - "backend/app/ranking/**"
      - "backend/app/response/**"
      - "backend/app/query_processing/**"
      - "evaluation/**"

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      ASTO_JWT_SECRET: test-secret-0123456789-0123456789-0123456789
      ASTO_ENVIRONMENT: test

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpass
          POSTGRES_DB: asto_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval "10s"
          --health-timeout "5s"
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      # Restore historical benchmark reports so the regression check has a
      # baseline. Without this the fresh checkout contains only the single
      # report generated below and the gate can never fire.
      - name: Restore previous benchmark reports
        uses: actions/cache@v4
        with:
          path: evaluation/reports
          key: eval-reports-${{ github.run_id }}
          restore-keys: |
            eval-reports-

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Install pgvector and set up schema
        env:
          ASTO_DATABASE_URL: postgresql://admin:adminpass@127.0.0.1:5432/asto_assistant
        run: |
          PGPASSWORD=adminpass psql -h localhost -U admin -d asto_assistant -c "CREATE EXTENSION IF NOT EXISTS vector;"
          cd backend
          python -c "from app.db.postgres.schema import ensure_schema; ensure_schema()"

      - name: Pre-download embedding model
        working-directory: backend
        env:
          ASTO_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/backend/nlp_models/embeddings
        run: |
          python -c "
          from app.config import settings
          from fastembed import TextEmbedding
          cache_dir = settings.embedding_cache_dir
          TextEmbedding(
              model_name=settings.embedding_model,
              cache_dir=cache_dir,
          ).embed(['ci warmup'])
          list(TextEmbedding(
              model_name=settings.embedding_model,
              cache_dir=cache_dir,
              local_files_only=True,
          ).embed(['ci warmup']))
          print('embedding model cached and loadable via local_files_only at', cache_dir)
          "

      - name: Seed benchmark data
        env:
          ASTO_DATABASE_URL: postgresql://admin:adminpass@127.0.0.1:5432/asto_assistant
          ASTO_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/backend/nlp_models/embeddings
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd backend
          python -c "
          from evaluation.datasets.seed_benchmark_data import clear_benchmark_data, seed_benchmark_data
          clear_benchmark_data()
          topics = seed_benchmark_data()
          print(f'Benchmark data seeded: {len(topics)} topics')
          "

      - name: Run benchmark
        env:
          ASTO_DATABASE_URL: postgresql://admin:adminpass@127.0.0.1:5432/asto_assistant
          ASTO_EMBEDDING_CACHE_DIR: ${{ github.workspace }}/backend/nlp_models/embeddings
          ASTO_JWT_SECRET: test-secret-0123456789-0123456789-0123456789
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python -m evaluation.run_benchmark --output-dir evaluation/reports

      - name: Check for regression
        run: |
          python -c "
          import json, glob
          reports = sorted(glob.glob('evaluation/reports/benchmark_*.json'), reverse=True)
          if len(reports) < 2:
              print('Not enough reports for comparison, skipping regression check')
              exit(0)
          latest = json.load(open(reports[0]))
          previous = json.load(open(reports[1]))
          latest_summary = latest.get('summary', {})
          previous_summary = previous.get('summary', {})
          threshold = 0.05
          failed = False
          for metric in ['sub_question_accuracy', 'intent_accuracy', 'entity_accuracy']:
              delta = latest_summary.get(metric, 0) - previous_summary.get(metric, 0)
              if delta < -threshold:
                  print(f'REGRESSION: {metric} dropped by {delta:.3f} (threshold: -{threshold})')
                  failed = True
                  continue
              print(f'{metric}: {previous_summary.get(metric, 0):.3f} -> {latest_summary.get(metric, 0):.3f} (delta: {delta:+.3f})')
          # Check retrieval metrics if available
          latest_retrieval = latest.get('retrieval_metrics', {})
          previous_retrieval = previous.get('retrieval_metrics', {})
          for metric in ['hit_rate@10', 'ndcg@10']:
              if metric in latest_retrieval and metric in previous_retrieval:
                  delta = latest_retrieval[metric] - previous_retrieval[metric]
                  if delta < -threshold:
                      print(f'REGRESSION: {metric} dropped by {delta:.3f} (threshold: -{threshold})')
                      failed = True
                      continue
                  print(f'{metric}: {previous_retrieval[metric]:.3f} -> {latest_retrieval[metric]:.3f} (delta: {delta:+.3f})')
          # Reranker latency gate (CLAUDE.md rule 6): fail when the reranker
          # ran and missed its <200ms p95 budget. When the reranker is
          # disabled there are no metrics and the gate does not apply.
          reranker = latest.get('latency_metrics', {}).get('reranker')
          if isinstance(reranker, dict) and 'p95_ms' in reranker:
              budget_ok = reranker.get('budget_ok')
              print(f\"reranker p95: {reranker.get('p95_ms')}ms (budget <200ms: {'PASS' if budget_ok else 'FAIL'})\")
              if budget_ok is False:
                  print('REGRESSION: reranker p95 exceeded the 200ms budget')
                  failed = True
          if failed:
              exit(1)
          print('No significant regression detected')
          "
