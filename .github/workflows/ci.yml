name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: adminpass
          POSTGRES_DB: asto_assistant
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U admin"
          --health-interval "10s"
          --health-timeout "5s"
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt -r backend/requirements-dev.txt

      - name: Install pgvector extension
        env:
          PGPASSWORD: adminpass
        run: |
          psql -h 127.0.0.1 -U admin -d asto_assistant -c "CREATE EXTENSION IF NOT EXISTS vector;"

      - name: Pre-download embedding model
        working-directory: backend
        run: |
          python -c "
          from app.config import settings
          from fastembed import TextEmbedding
          model = TextEmbedding(
              model_name=settings.embedding_model,
              cache_dir=settings.embedding_cache_dir,
          )
          list(model.embed(['ci warmup']))
          print('embedding model cached at', settings.embedding_cache_dir)
          "

      - name: Install frontend dependencies
        working-directory: frontend
        run: |
          npm ci

      - name: Build frontend
        working-directory: frontend
        run: |
          npm run build

      - name: Run unit tests
        env:
          ASTO_DATABASE_URL: postgresql://admin:adminpass@127.0.0.1:5432/asto_assistant
          ASTO_JWT_SECRET: dev-only-secret-change-me-in-production-32chars
          ASTO_ENVIRONMENT: test
          PGPASSWORD: adminpass
        run: |
          cd backend
          python -m pytest tests/unit/ -v --timeout=60

      - name: Run integration tests
        env:
          ASTO_DATABASE_URL: postgresql://admin:adminpass@127.0.0.1:5432/asto_assistant
          ASTO_JWT_SECRET: dev-only-secret-change-me-in-production-32chars
          ASTO_ENVIRONMENT: test
          PGPASSWORD: adminpass
          PYTHONPATH: ${{ github.workspace }}
        run: |
          cd backend
          python -m pytest tests/integration/ -v --timeout=120

  benchmark:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    defaults:
      run:
        working-directory: .
        shell: bash

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest
      - name: Run evaluation benchmark
        run: |
          python -m evaluation.run_benchmark --output-dir evaluation/reports
      - name: Upload benchmark report
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-report
          path: evaluation/reports/
