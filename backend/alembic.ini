[alembic]
script_location = migrations
# sqlalchemy.url is resolved at runtime in migrations/env.py from
# ASTO_DATABASE_URL (via app.config.Settings), translated to SQLAlchemy's
# psycopg3 dialect. A programmatic caller (tests, deploy tooling) may
# override it by setting the sqlalchemy.url option on the Config object.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S