<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline - Asto</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #0a0a0a;
        color: #f8f8f8;
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        text-align: center;
        padding: 2rem;
        max-width: 24rem;
      }
      .ring {
        width: 56px;
        height: 56px;
        margin: 0 auto 1rem;
        border-radius: 50%;
        border: 3px solid #f8f8f8;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .dot {
        width: 10px;
        height: 10px;
        border-radius: 50%;
        background: #60a5fa;
      }
      h1 {
        font-size: 1.25rem;
        margin: 0 0 0.5rem;
      }
      p {
        color: #a1a1aa;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="ring"><div class="dot"></div></div>
      <h1>You're offline</h1>
      <p>Reconnect to keep asking questions. Your history will be here when you're back.</p>
    </div>
  </body>
</html>
