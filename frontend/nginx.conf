server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    absolute_redirect off;
    # Next.js static export embeds the App Router RSC bootstrap as inline
    # <script> blocks (self.__next_f.push) that change per build, so neither
    # hashes nor nonces are usable on a static server; 'unsafe-inline' is
    # required or the login page's router/hydration is blocked.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval'; style-src 'self' 'unsafe-inline';" always;

    location /api/ {
        proxy_pass http://asto-backend:8011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 15s;
        proxy_read_timeout 30s;
    }

    location / {
        try_files $uri $uri.html $uri/ =404;
    }
}
