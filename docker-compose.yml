x-backend-env: &backend-env
  ASTO_DATABASE_URL: "${ASTO_DATABASE_URL:-postgresql://asto_app:devpass@postgres:5432/asto_assistant}"
  ASTO_JWT_SECRET: "${ASTO_JWT_SECRET:-dev-only-secret-change-me-in-production-32chars}"
  ASTO_ENVIRONMENT: "${ASTO_ENVIRONMENT:-development}"
  ASTO_MAX_EVIDENCE_DOCS: "${ASTO_MAX_EVIDENCE_DOCS:-5}"
  ASTO_RERANK_ENABLED: "${ASTO_RERANK_ENABLED:-false}"

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: asto_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: asto_app
      POSTGRES_PASSWORD: devpass
      POSTGRES_DB: asto_assistant
    volumes:
      - pg_data:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "5433:5432"
    deploy:
      resources:
        limits:
          memory: 200m
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U asto_app"]
      interval: 10s
      timeout: 5s
      retries: 5

  asto-backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: asto_backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      <<: *backend-env
      ASTO_CORS_ORIGINS: "*"
    volumes:
      - ./storage:/app/storage
    ports:
      - "8011:8011"
    deploy:
      resources:
        limits:
          # 200m is too low: the bge-small ONNX model loads at ~208MB peak on
          # its own; combined with uvicorn + asyncpg (~95MB) the search path
          # peaks ~300MB under Linux cgroups and is OOM-killed mid-response
          # (ERR_EMPTY_RESPONSE). Raised with evidence, not blindly (rule 10).
          memory: 384m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8011/api/v1/health', timeout=5).status == 200 else 1)"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    command: ["app.main:app", "--workers", "1", "--host", "0.0.0.0", "--port", "8011"]

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: asto_frontend
    restart: unless-stopped
    depends_on:
      asto-backend:
        condition: service_healthy
    ports:
      - "3011:80"

volumes:
  pg_data: