# docker-compose.watch.yml
#
# Override file for local development with `docker compose --watch`.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.watch.yml up
#
# The backend uses a bind mount + Uvicorn --reload for instant file
#   synchronization (no rebuild needed for .py changes).
# The frontend uses "rebuild" action — Next.js static export requires a
#   full rebuild on source changes, so the image is rebuilt when files change.
#
version: "3.9"

services:
  asto-backend:
    volumes:
      - ./backend:/app
      - ./storage:/app/storage
    command: >
      uvicorn app.main:app
      --workers 1
      --host 0.0.0.0
      --port 8011
      --reload
    watch:
      - path: ./backend
        action: sync
      - path: ./backend/requirements.txt
        action: rebuild
      - path: ./backend/requirements-dev.txt
        action: rebuild

  frontend:
    watch:
      - path: ./frontend
        action: rebuild
      - path: ./frontend/package.json
        action: rebuild
